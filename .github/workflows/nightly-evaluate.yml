name: Nightly Evaluation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ml-pipeline deps
        working-directory: ml-pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run post-match evaluation via backend
        working-directory: ml-pipeline
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            python evaluation/job_post_match.py
          elif [ -n "$DATABASE_URL" ]; then
            echo "BACKEND_URL not set; start backend or configure BACKEND_URL secret"
            exit 0
          else
            echo "No BACKEND_URL or DATABASE_URL configured, skipping"
            exit 0
          fi
