name: CI Python

on:
  push:
    branches: [main, develop]
    paths: ['ml-service/**', 'ml-pipeline/**', 'ai-agent/**', '.github/workflows/ci-python.yml']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ml-service, ml-pipeline, ai-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check . --select E,F,I
      - name: Import check
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "ml-service" ]; then
            python -c "from app.predictor import ModelRegistry"
          elif [ "${{ matrix.service }}" = "ai-agent" ]; then
            python -c "from app.agent import analyze"
          else
            python -c "from evaluation.metrics import compute_metrics"
            python -c "import train"
            python -c "from models.model_1x2 import predict"

  train-demo:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements.txt
      - name: Train demo models
        working-directory: ml-pipeline
        env:
          MLFLOW_TRACKING_URI: file:///tmp/prono-mlruns
          ML_MODELS_DIR: ../ml-service/models
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python train_demo.py
      - name: Pytest smoke
        working-directory: ml-pipeline
        run: |
          pip install pytest
          python train_demo.py
          pytest tests/test_predict.py -q
