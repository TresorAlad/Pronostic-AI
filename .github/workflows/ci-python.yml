name: CI Python

on:
  push:
    branches: [main, develop]
    paths: ['ml-service/**', 'ml-pipeline/**', 'ai-agent/**', '.github/workflows/ci-python.yml']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml-service, ml-pipeline, ai-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check . || true
      - name: Import check
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "ml-service" ]; then
            python -c "from app.predictor import ModelRegistry"
          elif [ "${{ matrix.service }}" = "ai-agent" ]; then
            python -c "from app.agent import analyze"
          else
            python -c "from evaluation.metrics import compute_metrics"
          fi

  train-demo:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train demo models
        working-directory: ml-pipeline
        run: |
          pip install -r requirements.txt
          python train.py
