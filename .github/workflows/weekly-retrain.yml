name: Weekly Retrain

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements.txt
      - name: Train models
        working-directory: ml-pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_MODELS_DIR: ../ml-service/models
          MLFLOW_TRACKING_URI: file:///tmp/prono-mlruns
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "$DATABASE_URL" ]; then
            python train.py
          else
            python train_demo.py
          fi
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-models
          path: ml-service/models/*.joblib

  deploy-models:
    needs: retrain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ml-models
          path: ml-service/models
      - name: Reload ML service
        env:
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL }}
        run: |
          if [ -z "$ML_SERVICE_URL" ]; then
            echo "ML_SERVICE_URL not configured, skipping reload"
            exit 0
          fi
          curl -sf -X POST "${ML_SERVICE_URL%/}/models/reload"
