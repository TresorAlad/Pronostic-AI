name: CI Go

on:
  push:
    branches: [main, develop]
    paths: ['collector/**', 'backend/**', '.github/workflows/ci-go.yml']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [collector, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Tidy modules
        if: matrix.service == 'collector'
        working-directory: collector
        run: go mod tidy
      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          go mod download
          if [ "${{ matrix.service }}" = "collector" ]; then
            go build -v ./cmd/collector
          else
            go build -v ./cmd/server
          fi
      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            go test -race ./...
          else
            go test ./...
          fi
