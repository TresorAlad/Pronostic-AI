name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [collector, backend, ml-service, ai-agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'ml-service' && '.' || format('./{0}', matrix.service) }}
          file: ${{ matrix.service == 'ml-service' && 'ml-service/Dockerfile' || format('{0}/Dockerfile', matrix.service) }}
          push: false
          tags: prono-${{ matrix.service }}:ci
          load: true
